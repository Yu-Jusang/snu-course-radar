name: Collect public courses and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: course-radar-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chromium
        if: github.event_name != 'push'
      - name: Collect complete anonymous public snapshot
        id: collect
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run collect
      - name: Save snapshot or failed-refresh status
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/courses.json docs/data/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public course snapshot and collection status'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Report failed collection
        if: steps.collect.outcome == 'failure'
        run: echo '::warning::Collection failed; deploying the last successful snapshot with a visible delay notice.'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
